services:
  neko-master:
    image: foru17/neko-master:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-neko-master}

    restart: unless-stopped

    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_EXTERNAL_PORT:-3000}:3000"
      - "${BIND_ADDRESS:-0.0.0.0}:${API_EXTERNAL_PORT:-3001}:3001"
      - "${BIND_ADDRESS:-0.0.0.0}:${WS_EXTERNAL_PORT:-3002}:3002"

    extra_hosts:
      - host.docker.internal:host-gateway

    env_file:
      - path: .env
        required: false
    environment:
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    volumes:
      - ${MNT_DIR:-/mnt/docker}/neko-master/data:/app/data
      # 本地 MMDB 可选；文件应放入宿主机 geoip 目录。
      - ${MNT_DIR:-/mnt/docker}/neko-master/geoip:/app/data/geoip:ro
