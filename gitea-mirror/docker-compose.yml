# Gitea Mirror deployment configuration
# Standard deployment with automatic database maintenance

services:
  gitea-mirror:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE:-raylabshq/gitea-mirror}:${DOCKER_TAG:-latest}
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   platforms:
    #     - linux/amd64
    #     - linux/arm64
    #   cache_from:
    #     - ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_IMAGE:-raylabshq/gitea-mirror}:${DOCKER_TAG:-latest}
    container_name: ${CONTAINER_NAME:-gitea-mirror}

    restart: unless-stopped

    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-4321}:${PORT:-4321}"
    # extra_hosts:
    #   - host.docker.internal:host-gateway

    env_file:
      - path: .env
        required: false
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          BASE="$${BASE_URL:-/}";
          if [ "$${BASE}" = "/" ]; then BASE=""; else BASE="$${BASE%/}"; fi;
          SCHEME=http;
          if [ -n "$${SERVER_CERT_PATH:-}" ] && [ -n "$${SERVER_KEY_PATH:-}" ]; then SCHEME=https; fi;
          wget --no-check-certificate --no-verbose --tries=3 --spider
          "$${SCHEME}://localhost:$${PORT:-4321}$${BASE}/api/health"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

    volumes:
      - ${MNT_DIR:-/mnt/docker}/gitea-mirror:/app/data
      # Mount custom CA certificates - choose one option:
      # Option 1: Mount individual CA certificates from certs directory
      # - ./certs:/app/certs:ro
      # Option 2: Mount system CA bundle (if your CA is already in system store)
      # - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
