services:
  umami:
    image: umamisoftware/umami:${IMAGE_TAG:-latest}

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - ${UMAMI_PORT:-3000}:3000"

    extra_hosts:
      - host.docker.internal:host-gateway

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-umami}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-umami}
      DATABASE_TYPE: postgresql
      DISABLE_UPDATES: ${DISABLE_UPDATES:-1}
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-1}

    labels:
      com.centurylinklabs.watchtower.enable: ${UMAMI_WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:${POSTGRES_IMAGE_TAG:-18}

    restart: unless-stopped

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DB_PORT}:5432"

    extra_hosts:
      - host.docker.internal:host-gateway

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umami}
      POSTGRES_USER: ${POSTGRES_USER:-umami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    labels:
      com.centurylinklabs.watchtower.enable: ${DB_WATCHTOWER_ENABLE:-false}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - ${MNT_DIR:-/mnt/docker}/umami/db:/var/lib/postgresql

    shm_size: 1g
