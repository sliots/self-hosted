services:
  watchtower:
    image: nickfedor/watchtower:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-watchtower}

    restart: unless-stopped

    # 启用 HTTP API 时取消注释，并优先绑定到回环地址或受控反向代理。
    # ports:
    #   - "${BIND_ADDRESS:-127.0.0.1}:${WATCHTOWER_HTTP_API_HOST_PORT:-8080}:8080"

    # extra_hosts:
    #   - host.docker.internal:host-gateway

    env_file:
      - path: .env
        required: false
    environment:
      WATCHTOWER_CLEANUP: ${WATCHTOWER_CLEANUP:-true}
      WATCHTOWER_LABEL_ENABLE: ${WATCHTOWER_LABEL_ENABLE:-true}
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-600}
      WATCHTOWER_UPDATE_ON_START: ${WATCHTOWER_UPDATE_ON_START:-true}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    volumes:
      # Docker socket 等同于 Docker daemon 管理权限，应仅授予受信任镜像。
      - /var/run/docker.sock:/var/run/docker.sock
