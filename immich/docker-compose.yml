#
# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

name: immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: ${IMMICH_SERVER_CONTAINER_NAME:-immich_server}

    restart: always
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding

    depends_on:
      - redis
      - database

    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-2283}:${IMMICH_PORT:-2283}"

    extra_hosts:
      - host.docker.internal:host-gateway

    env_file:
      - path: .env
        required: true

    labels:
      com.centurylinklabs.watchtower.enable: ${IMMICH_SERVER_WATCHTOWER_ENABLE:-true}

    healthcheck:
      disable: false

    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION:?UPLOAD_LOCATION is required}:${IMMICH_MEDIA_LOCATION:-/data}
      - /etc/localtime:/etc/localtime:ro

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: ${IMMICH_MACHINE_LEARNING_CONTAINER_NAME:-immich_machine_learning}

    restart: always
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable

    extra_hosts:
      - host.docker.internal:host-gateway

    env_file:
      - path: .env
        required: true

    labels:
      com.centurylinklabs.watchtower.enable: ${IMMICH_MACHINE_LEARNING_WATCHTOWER_ENABLE:-true}

    healthcheck:
      disable: false

    volumes:
      - model-cache:/cache

  redis:
    # compose-style: allow OPS001 - digest 固定镜像不使用可变 tag
    image: ghcr.io/valkey/valkey:9@sha256:3eeb09785cd61ec8e3be35f8804c8892080f3ca21934d628abc24ee4ed1698f6
    container_name: ${REDIS_CONTAINER_NAME:-immich_redis}

    restart: always

    extra_hosts:
      - host.docker.internal:host-gateway

    labels:
      com.centurylinklabs.watchtower.enable: ${REDIS_WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  database:
    # compose-style: allow OPS001 - digest 固定镜像不使用可变 tag
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: ${DATABASE_CONTAINER_NAME:-immich_postgres}

    restart: always

    extra_hosts:
      - host.docker.internal:host-gateway

    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: "${DB_STORAGE_TYPE:-}"

    labels:
      com.centurylinklabs.watchtower.enable: ${DATABASE_WATCHTOWER_ENABLE:-false}

    healthcheck:
      disable: false

    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION:?DB_DATA_LOCATION is required}:/var/lib/postgresql/data

    shm_size: 128mb

volumes:
  model-cache:
