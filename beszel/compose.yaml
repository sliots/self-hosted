services:
  beszel:
    image: henrygd/beszel:${IMAGE_TAG:-0}

    restart: unless-stopped

    ports:
      - ${BESZEL_HOST_PORT:-8090}:8090

    extra_hosts:
      - host.docker.internal:host-gateway

    env_file:
      - path: .env
        required: false

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      start_period: 5s

    volumes:
      - ${MNT_DIR:-.}/beszel_data:/beszel_data
