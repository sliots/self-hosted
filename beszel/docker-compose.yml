services:
  beszel-hub:
    image: henrygd/beszel:${IMAGE_TAG:-0}
    container_name: ${CONTAINER_NAME:-beszel}

    restart: unless-stopped

    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8090}:8090"

    extra_hosts:
      - host.docker.internal:host-gateway

    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      start_period: 5s

    volumes:
      - ${MNT_DIR:-/mnt/docker}/beszel/data:/beszel_data
