services:
  certimate:
    image: certimate/certimate:${IMAGE_TAG:-v0.4}
    container_name: ${CONTAINER_NAME:-certimate}

    restart: unless-stopped

    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8090}:8090"

    extra_hosts:
      - host.docker.internal:host-gateway

    env_file:
      - path: .env
        required: false

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    volumes:
      - ${MNT_DIR:-/mnt/docker}/certimate:/app/pb_data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
