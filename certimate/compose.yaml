services:
  certimate:
    image: ${REGISTRY:-registry.cn-shanghai.aliyuncs.com/}certimate/certimate:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-certimate}

    restart: unless-stopped

    ports:
      - ${CERTIMATE_HOST_PORT:-8090}:8090

    extra_hosts:
      - host.docker.internal:host-gateway

    env_file:
      - path: .env
        required: false

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    volumes:
      - ${MNT_DIR:-.}/certimate:/app/pb_data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
