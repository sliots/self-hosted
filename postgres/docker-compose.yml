services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-18}
    container_name: ${POSTGRES_CONTAINER_NAME:-postgres}

    restart: unless-stopped

    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-5432}:5432"
    # extra_hosts:
    #   - host.docker.internal:host-gateway

    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-false}

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$${POSTGRES_USER:-postgres}"
          -d "$${POSTGRES_DB:-$${POSTGRES_USER:-postgres}}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - ${MNT_DIR:-/mnt/docker}/postgres:/var/lib/postgresql
      - ${TMP_DIR:-/tmp}:/tmp
      # 仅在首次初始化空数据目录时执行，按文件名排序。
      # - ${INITDB_DIR:-/mnt/docker/postgres-initdb}:/docker-entrypoint-initdb.d:ro
    shm_size: ${SHM_SIZE:-256M}

    deploy:
      resources:
        limits:
          memory: ${RESOURCES_LIMITS_MEMORY:-1G}
