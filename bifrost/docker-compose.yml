services:
  bifrost:
    image: maximhq/bifrost:${BIFROST_IMAGE_TAG:-latest}
    container_name: bifrost
    restart: unless-stopped

    ports:
      - ${PORT:-8080}:8080

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s

    volumes:
      - ${MNT_DIR:-/mnt/docker}/bifrost:/app/data

    extra_hosts:
      - host.docker.internal:host-gateway
