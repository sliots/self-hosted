services:
  homeassistant:
    image: homeassistant/home-assistant:${IMAGE_TAG:-stable}
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    network_mode: host

    environment:
      TZ: ${TZ:-Asia/Shanghai}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/manifest.json"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 120s

    volumes:
      - ${MNT_DIR:-/mnt/docker}/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
