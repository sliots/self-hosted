services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:${IMAGE_TAG:-latest}

    restart: unless-stopped

    ports:
      - ${BACKREST_HOST_PORT:-9898}:9898

    extra_hosts:
      - host.docker.internal:host-gateway

    env_file:
      - path: .env
        required: false

    environment:
      TZ: ${TZ:-Asia/Shanghai}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9898"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s

    volumes:
      - ./backrest/data:/data
      - ./backrest/config:/config
      - ./backrest/cache:/cache
      - ./backrest/tmp:/tmp
      # - ./backrest/rclone:/root/.config/rclone # Mount for rclone config (needed when using rclone remotes)
      # - ./backrest/repos:/repos # Mount local repos (optional for remote storage)
      - ${USERDATA_DIR}:/userdata:ro
