services:
  backrest:
    image: garethgeorge/backrest:${IMAGE_TAG:-latest}
    container_name: backrest
    hostname: backrest
    restart: unless-stopped

    ports:
      - ${PORT:-9898}:9898

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9898"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s

    volumes:
      - ${MNT_DIR:-/mnt/docker}/backrest/data:/data
      - ${MNT_DIR:-/mnt/docker}/backrest/config:/config
      - ${MNT_DIR:-/mnt/docker}/backrest/cache:/cache
      - ${MNT_DIR:-/mnt/docker}/backrest/tmp:/tmp
      - ${MNT_DIR:-/mnt/docker}/backrest/rclone:/root/.config/rclone
      - ${MNT_DIR:-/mnt/docker}:/userdata:ro
