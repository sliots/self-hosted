services:
  vaultwarden:
    image: vaultwarden/server:${IMAGE_TAG:-latest}

    restart: unless-stopped

    ports:
      - ${VAULTWARDEN_HOST_PORT}:80

    extra_hosts:
      - host.docker.internal:host-gateway

    env_file:
      - path: .env
        required: false

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    volumes:
      - ${MNT_DIR:-/mnt/docker}/vaultwarden/vw-data:/data
